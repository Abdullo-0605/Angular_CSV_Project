<div class="app-shell">
  <header class="app-header">
    <h1>Data Plotter</h1>
    <p class="app-sub">DataLogger &mdash; waveform plotting for the power electronics testbed</p>
  </header>

  <!-- ============ PRIMARY: THE PLOTTER ============ -->
  <datalogger-dataplotter />

  <!-- ============ SECONDARY: DEV-ONLY SIMULATOR ============ -->
  <section class="sim-section">
    <button type="button" class="sim-toggle" (click)="simulatorOpen.set(!simulatorOpen())">
      <span class="sim-caret">{{ simulatorOpen() ? '▾' : '▸' }}</span>
      Testbed Simulator
      <span class="sim-note">development only — excluded from HMI integration</span>
    </button>

    @if (simulatorOpen()) {
      <testbed-simulator (plotSource)="onSimulatorSource($event)" />
    }
  </section>
</div>
